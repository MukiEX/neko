# /etc/pulse/daemon.conf.d/neko-surround.conf
#
# Stereo streams (Firefox) must stay on front left/right of the 5.1 sink. By default
# PulseAudio copies them into the rear channels too, which a Pro Logic II encode
# would then turn into fake surround.
remixing-use-all-sink-channels = no
remixing-produce-lfe = no
remixing-consume-lfe = no

default-sample-rate = 48000
default-sample-channels = 2
